name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Trova ed estrai il file ZIP
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Trovato lo zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          rsync -av extracted_project/*/ ./ 
        else
          echo "Nessun file zip trovato!"
          exit 1
        fi

    - name: Prepara Gradle Wrapper
      run: |
        gradle wrapper || true
        chmod +x gradlew || true

    - name: Compila APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Carica l'APK tra gli Artefatti
      uses: actions/upload-artifact@v4
      with:
        name: JukeNissanLauncher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
