name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Estrai il file ZIP
      run: |
        echo "Estrazione del progetto in corso..."
        unzip -o "JukeNissanLauncher_9_10-1_pollici.zip" -d unpacked
        shopt -s dotglob
        mv unpacked/*/* unpacked/*/.[^.]* ./ 2>/dev/null || true
        rm -rf unpacked

    - name: Prepara Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Compila APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Carica l'APK tra gli Artefatti
      uses: actions/upload-artifact@v4
      with:
        name: JukeNissanLauncher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
