name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Trova ed estrai lo ZIP con fallback
      run: |
        echo "Contenuto della cartella:"
        ls -la
        
        # Cerca qualsiasi file zip nella cartella
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "Errore: Nessun file zip trovato nella root!"
          exit 1
        fi
        
        echo "Trovato file zip: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d unpacked
        shopt -s dotglob
        mv unpacked/*/* unpacked/*/.[^.]* ./ 2>/dev/null || true
        rm -rf unpacked

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepara Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Compila APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Carica l'APK tra gli Artefatti
      uses: actions/upload-artifact@v4
      with:
        name: JukeNissanLauncher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
