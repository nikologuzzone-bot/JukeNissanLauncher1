name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Estrai lo ZIP e posiziona i file con Python
      run: |
        python3 -c "
        import glob, zipfile, os, shutil
        zips = glob.glob('*.zip')
        if not zips:
            print('Nessun file zip trovato!')
            exit(1)
        zip_name = zips[0]
        print(f'Trovato zip: {zip_name}')
        with zipfile.ZipFile(zip_name, 'r') as zip_ref:
            zip_ref.extractall('unzipped_folder')
        
        src = 'unzipped_folder'
        items = os.listdir(src)
        if len(items) == 1 and os.path.isdir(os.path.join(src, items[0])):
            src = os.path.join(src, items[0])
            
        for item in os.listdir(src):
            s = os.path.join(src, item)
            d = os.path.join('.', item)
            if os.path.exists(d):
                if os.path.isdir(d): shutil.rmtree(d)
                else: os.remove(d)
            shutil.move(s, d)
        shutil.rmtree('unzipped_folder')
        print('Estrazione completata!')
        "
        echo "Struttura della cartella root:"
        ls -la

    - name: Prepara Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Allinea compatibilità Java a 17 nei file di progetto
      run: |
        python3 -c "
        import glob
        files = glob.glob('**/build.gradle*', recursive=True)
        print(f'File build.gradle trovati: {files}')
        for filepath in files:
            if '.gradle' in filepath or 'build/' in filepath: continue
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            
            new_content = content.replace('VERSION_1_8', 'VERSION_17')
            new_content.replace('1.8', '17')
            new_content = new_content.replace('1.8', '17')
            new_content = new_content.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
            
            if new_content != content:
                with open(filepath, 'w', encoding='utf-8') as f:
                    f.write(new_content)
                print(f'--> Aggiornato con successo: {filepath}')
            else:
                print(f'Nessuna modifica necessaria in: {filepath}')
        "

    - name: Compila APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Carica l'APK tra gli Artefatti
      uses: actions/upload-artifact@v4
      with:
        name: JukeNissanLauncher-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
          **/*.apk
